<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>손짓의 알파벳 · 자모표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;600&display=swap">
<style>
  /* 팀 앱의 보라 + 1학기 꾸민 모습 캐릭터 색. 둥글고 통통하게. */
  :root {
    --bg: #F6F3FF;
    --bg2: #FFF1F4;
    --card: #FFFFFF;
    --purple: #7C6CF2;
    --purple-soft: #E9E4FF;
    --ink: #2B2350;
    --ink-soft: #6B6490;
    --peach: #FFAB7A;
    --mint: #6FD0AE;
    --butter: #FFD66B;
    --pink: #FF7A9A;
    --sky: #8ECBEA;
    --display: 'Jua', 'Malgun Gothic', sans-serif;
    --body: 'Gowun Dodum', 'Malgun Gothic', sans-serif;
    --num: 'Fredoka', 'Jua', sans-serif;
    --shadow: 0 10px 30px rgba(92, 76, 200, .16), 0 2px 6px rgba(92, 76, 200, .08);
  }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; overflow: hidden; color: var(--ink); font-family: var(--body);
    background: radial-gradient(120% 90% at 20% 10%, #FFFFFF 0%, var(--bg) 45%, var(--bg2) 100%); }
  #stage { position: fixed; inset: 0; z-index: 1 }
  #stage canvas { display: block; cursor: grab }
  #stage canvas.point { cursor: pointer }

  /* 떠다니는 장식 */
  #deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden }
  #deco i { position: absolute; display: block; opacity: .55; animation: float 14s ease-in-out infinite }
  #deco .dot { border-radius: 50% }
  #deco .star { clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%) }
  #deco .ring { border-radius: 50%; background: transparent !important; border: 6px solid currentColor }
  @keyframes float { 0%,100% { transform: translate(0,0) rotate(0) } 50% { transform: translate(18px,-26px) rotate(25deg) } }

  .hud { position: fixed; inset: 0; z-index: 2; pointer-events: none }
  header { position: absolute; left: 40px; right: 40px; top: 28px; display: flex; justify-content: space-between; align-items: center }
  .brand { font-family: var(--display); font-size: 20px; color: var(--purple); display: flex; align-items: center; gap: 10px;
    background: var(--card); padding: 8px 18px 8px 10px; border-radius: 999px; box-shadow: var(--shadow) }
  .brand b { font-weight: 400; color: var(--ink) }
  .brand .logo { width: 30px; height: 30px; border-radius: 50%; background: var(--purple); display: grid; place-items: center; color: #fff; font-size: 16px }
  .dots { display: flex; gap: 8px; pointer-events: auto }
  .dots button { width: 12px; height: 12px; border-radius: 999px; border: 0; padding: 0; background: #D6D0F5; cursor: pointer; transition: width .35s cubic-bezier(.34,1.56,.64,1), background .3s }
  .dots button.on { width: 34px; background: var(--purple) }
  .dots button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px }

  /* 장면 제목 (표지 등) */
  .title { position: absolute; left: 64px; bottom: 120px; max-width: 46vw }
  .title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(54px, 7vw, 120px); line-height: 1.02; margin: 0 0 18px; color: var(--ink); letter-spacing: -.01em }
  .title h1 .ch { display: inline-block; animation: hop .7s cubic-bezier(.34,1.56,.64,1) both }
  .title h1 .accent { color: var(--purple) }
  .title p { font-size: clamp(17px, 1.3vw, 23px); line-height: 1.65; color: var(--ink-soft); margin: 0; max-width: 32em; animation: rise .8s .5s both }
  .title .num { font-family: var(--num); color: var(--purple); font-weight: 600 }
  .title.hidden { display: none }

  /* 자막: 말풍선 */
  .caption { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); max-width: min(980px, 76vw);
    background: var(--card); border-radius: 26px; padding: 16px 28px; box-shadow: var(--shadow);
    font-family: var(--display); font-size: clamp(19px, 1.55vw, 28px); line-height: 1.45; text-align: center; color: var(--ink);
    transition: opacity .3s, transform .45s cubic-bezier(.34,1.56,.64,1) }
  .caption::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 22px; height: 22px; background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 4px }
  .caption.hide { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(.96) }
  .caption em { font-style: normal; color: var(--purple) }
  .caption code { font-family: var(--num); font-size: .92em; color: var(--pink); font-weight: 600 }
  .caption .ch { display: inline-block; animation: pop .42s cubic-bezier(.34,1.56,.64,1) both; white-space: pre }

  /* 큰 숫자 카드 */
  .figure { position: absolute; right: 52px; top: 50%; transform: translateY(-50%) scale(.8); opacity: 0; transition: opacity .3s, transform .5s cubic-bezier(.34,1.56,.64,1);
    background: var(--card); border-radius: 30px; padding: 22px 30px 18px; box-shadow: var(--shadow); text-align: right; min-width: 220px }
  .figure.show { opacity: 1; transform: translateY(-50%) scale(1) }
  .figure.bump { animation: bump .5s cubic-bezier(.34,1.56,.64,1) }
  .figure .big { font-family: var(--num); font-weight: 600; font-size: clamp(54px, 6vw, 104px); line-height: 1; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
  .figure .big small { font-size: .34em; color: var(--ink-soft); font-weight: 500; margin-left: .15em }
  .figure .lab { font-family: var(--display); font-size: 17px; color: var(--purple); margin-top: 8px }

  /* 아래 조작 띠 */
  footer { position: absolute; left: 40px; right: 40px; bottom: 26px; display: flex; align-items: center; gap: 18px; pointer-events: auto }
  .btn { font-family: var(--display); font-size: 16px; color: var(--ink); background: var(--card); border: 0; border-radius: 999px; padding: 10px 18px; box-shadow: var(--shadow); cursor: pointer;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1) }
  .btn:hover { transform: translateY(-2px) scale(1.04) }
  .btn:active { transform: scale(.95) }
  .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px }
  .bar { position: relative; flex: 1; height: 10px; background: var(--purple-soft); border-radius: 999px; cursor: pointer }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--purple); border-radius: 999px }
  .bar b { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 5px solid var(--purple); transform: translate(-50%, -50%); box-shadow: var(--shadow) }
  .bar s { position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%) }
  .keys { font-family: var(--display); font-size: 14px; color: var(--ink-soft); white-space: nowrap }
  .keys kbd { font: inherit; background: var(--card); border-radius: 8px; padding: 2px 8px; margin: 0 2px; box-shadow: 0 2px 0 #D6D0F5; color: var(--ink) }

  /* 장면 안 행동 버튼 (예: 귀 고쳐 주기) */
  .action { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none;
    font-family: var(--display); font-size: 24px; color: #fff; background: var(--purple); border: 0; border-radius: 999px; padding: 16px 34px; box-shadow: 0 10px 0 #5B4FC8, var(--shadow); cursor: pointer;
    transition: opacity .3s, transform .45s cubic-bezier(.34,1.56,.64,1) }
  .action.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; animation: wiggle 1.6s 1s ease-in-out infinite }
  .action:active { transform: translateX(-50%) translateY(6px); box-shadow: 0 4px 0 #5B4FC8 }
  .action:focus-visible { outline: 4px solid var(--pink); outline-offset: 4px }

  /* 단어 찾기 */
  .search { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 999px; padding: 8px 10px 8px 22px; box-shadow: var(--shadow); transition: opacity .3s, transform .45s cubic-bezier(.34,1.56,.64,1) }
  .search.show { opacity: 1; transform: translateX(-50%); pointer-events: auto }
  .search label { font-family: var(--display); font-size: 18px; color: var(--ink-soft) }
  .search input { font-family: var(--display); font-size: 22px; border: 0; outline: 0; background: var(--purple-soft); border-radius: 999px; padding: 8px 18px; width: 180px; color: var(--ink) }
  .search input:focus { box-shadow: 0 0 0 3px var(--purple) }
  .search output { font-family: var(--num); font-size: 18px; color: var(--purple); min-width: 90px; font-weight: 600 }

  /* 토큰 카드 */
  .card { position: absolute; width: 300px; background: var(--card); border-radius: 28px; padding: 18px 20px 20px; box-shadow: 0 24px 60px rgba(92,76,200,.28); pointer-events: auto;
    transform-origin: 50% 100%; animation: cardin .45s cubic-bezier(.34,1.56,.64,1) both }
  .card[hidden] { display: none }
  .card .top { display: flex; justify-content: space-between; align-items: center }
  .card .no { font-family: var(--num); font-weight: 600; font-size: 30px; color: var(--purple) }
  .card .x { border: 0; background: var(--purple-soft); color: var(--purple); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer }
  .card canvas { display: block; width: 100%; height: auto; background: linear-gradient(#FBFAFF, #F1EDFF); border-radius: 20px; margin: 10px 0 12px }
  .card .use { font-family: var(--display); font-size: 16px; color: var(--ink-soft); margin-bottom: 8px }
  .card .use b { font-family: var(--num); color: var(--ink); font-weight: 600 }
  .card .w { display: grid; grid-template-columns: 88px 1fr 42px; align-items: center; gap: 8px; font-family: var(--display); font-size: 16px; margin: 5px 0 }
  .card .w span { height: 10px; border-radius: 999px; background: var(--purple-soft); position: relative; overflow: hidden }
  .card .w span i { position: absolute; inset: 0 auto 0 0; background: var(--butter); border-radius: 999px; transform-origin: left; animation: grow .6s cubic-bezier(.34,1.56,.64,1) both }
  .card .w em { font-style: normal; font-family: var(--num); font-size: 14px; color: var(--ink-soft); text-align: right }
  .card .rest { font-family: var(--display); font-size: 15px; color: var(--ink-soft); background: var(--purple-soft); border-radius: 12px; padding: 8px 12px }

  /* 장면 전환: 비눗방울 세 겹 */
  #wipe { position: fixed; inset: 0; z-index: 5; pointer-events: none }
  #wipe i { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%; transform: scale(0) }
  #wipe .w1 { background: var(--butter) } #wipe .w2 { background: var(--pink) } #wipe .w3 { background: var(--purple) }
  #wipe .label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.5); opacity: 0; font-family: var(--display); font-size: clamp(40px, 5vw, 80px); color: #fff; text-align: center; white-space: nowrap }
  #wipe .label small { display: block; font-family: var(--num); font-size: .38em; opacity: .85; margin-bottom: 8px }

  #loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); font-family: var(--display); font-size: 26px; color: var(--purple); transition: opacity .6s }
  #loading.done { opacity: 0; pointer-events: none }

  /* 정리 장면: 눌러서 뒤집는 카드 */
  .cards { position: absolute; left: 50%; top: 168px; transform: translateX(-50%); display: flex; gap: 26px; pointer-events: auto; width: max-content; max-width: 94vw; flex-wrap: wrap; justify-content: center }
  .cards[hidden] { display: none }
  .fc { width: 290px; height: 214px; perspective: 1000px; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-align: left;
    animation: cardin .7s cubic-bezier(.34,1.56,.64,1) both }
  .fc:focus-visible { outline: 4px solid var(--pink); outline-offset: 6px; border-radius: 30px }
  .fc .in { position: relative; width: 100%; height: 100%; transition: transform .75s cubic-bezier(.34,1.56,.64,1); transform-style: preserve-3d }
  .fc:hover .in { transform: translateY(-6px) rotate(-1deg) }
  .fc.flip .in { transform: rotateY(180deg) }
  .fc .f, .fc .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 30px; box-shadow: var(--shadow); padding: 24px 26px; display: flex; flex-direction: column; justify-content: center; gap: 6px }
  .fc .f { background: var(--card); border-top: 12px solid var(--c) }
  .fc .f .n { font-family: var(--num); font-weight: 600; font-size: 60px; line-height: 1; letter-spacing: -.02em }
  .fc .f .n small { font-size: .38em; color: var(--ink-soft); margin-left: .15em }
  .fc .f .l { font-family: var(--display); font-size: 22px; color: var(--ink) }
  .fc .f .hint { font-family: var(--display); font-size: 14px; color: var(--ink-soft); margin-top: 10px }
  .fc .b { background: var(--c); color: #fff; transform: rotateY(180deg); font-family: var(--display); font-size: 18px; line-height: 1.55 }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); z-index: 6; background: var(--ink); color: #fff; font-family: var(--display); font-size: 18px; padding: 10px 22px; border-radius: 999px; opacity: 0; transition: opacity .3s, transform .4s cubic-bezier(.34,1.56,.64,1); pointer-events: none }
  #toast.show { opacity: 1; transform: translateX(-50%) }
  body.nohud .hud { opacity: 0; pointer-events: none } body.nohud .hud * { pointer-events: none !important }
  .hud { transition: opacity .4s }
  .btn, .search label, .keys, .brand { white-space: nowrap }
  .search label, .search output { flex: none }
  @media (max-width: 1200px) { .keys { display: none } }
  @media (max-width: 760px) {
    header { left: 16px; right: 16px; top: 16px } .brand { font-size: 15px } footer { left: 16px; right: 16px; bottom: 16px; gap: 10px }
    .title { left: 20px; bottom: 150px; max-width: 80vw } .figure { right: 16px; top: auto; bottom: 150px; transform: scale(.8); min-width: 0 } .figure.show { transform: none }
    .caption { top: 70px; max-width: 90vw; padding: 12px 18px } .search label { display: none }
  }
  @keyframes hop { from { opacity: 0; transform: translateY(.5em) scale(.6) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: translateY(.45em) scale(.7) } to { opacity: 1; transform: none } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes bump { 0% { transform: translateY(-50%) scale(1) } 40% { transform: translateY(-50%) scale(1.08) } 100% { transform: translateY(-50%) scale(1) } }
  @keyframes wiggle { 0%,100% { rotate: 0deg } 10% { rotate: -4deg } 20% { rotate: 4deg } 30% { rotate: 0deg } }
  @keyframes cardin { from { opacity: 0; transform: translateY(16px) scale(.7) } to { opacity: 1; transform: none } }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="deco" aria-hidden="true"></div>
<div id="stage"></div>
<div class="hud">
  <header>
    <div class="brand"><span class="logo">✋</span>손짓의 알파벳 · <b>자모표</b> · 정재훈</div>
    <nav class="dots" id="dots" aria-label="장면"></nav>
  </header>
  <div class="title hidden" id="title"><h1 id="titleH"></h1><p id="titleP"></p></div>
  <div class="caption hide" id="caption" aria-live="polite"></div>
  <div class="figure" id="figure"><div class="big" id="figBig"></div><div class="lab" id="figLab"></div></div>
  <button class="action" id="action" type="button"></button>
  <div class="search" id="search"><label for="q">단어로 찾기</label><input id="q" placeholder="학교" autocomplete="off"><output id="qOut"></output></div>
  <div class="card" id="card" hidden></div>
  <div class="cards" id="cards" hidden></div>
  <footer>
    <button class="btn" id="prev" type="button" aria-label="이전 장면">◀</button>
    <button class="btn" id="play" type="button" aria-label="재생 또는 일시정지">일시정지</button>
    <button class="btn" id="next" type="button" aria-label="다음 장면">▶</button>
    <div class="bar" id="bar" tabindex="0" role="slider" aria-label="장면 안에서 이동"><i id="barFill"></i><b id="barKnob"></b></div>
    <div class="keys"><kbd>←</kbd><kbd>→</kbd> 장면 · <kbd>Space</kbd> 멈춤 · <kbd>F</kbd> 전체화면 · <kbd>H</kbd> 글자 숨김 · <kbd>A</kbd> 자동 넘김</div>
  </footer>
</div>
<div id="wipe" aria-hidden="true"><i class="w1"></i><i class="w2"></i><i class="w3"></i><div class="label" id="wipeLabel"></div></div>
<div id="toast" role="status"></div>
<div id="loading">동작 글자를 꺼내는 중…</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
