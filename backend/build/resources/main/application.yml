server:
  port: 8080

spring:
  application:
    name: sign-language-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

app:
  frontend-base-url: http://localhost:8081/home
  oauth2-success-url: ${app.frontend-base-url}/
