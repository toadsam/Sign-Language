server:
  port: 8080

spring:
  application:
    name: sign-language-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_WEB_CLIENT_ID:dev-google-client-id}}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope: openid, profile, email

google:
  client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_WEB_CLIENT_ID:dev-google-client-id}}

jwt:
  secret: ${JWT_SECRET:}
  access-exp-min: ${JWT_ACCESS_EXP_MIN:60}
  refresh-exp-day: ${JWT_REFRESH_EXP_DAY:14}

app:
  frontend-base-url: http://localhost:8081/home
  oauth2-success-url: ${app.frontend-base-url}/

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
