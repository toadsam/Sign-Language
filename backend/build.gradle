plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.wow'
version = '0.0.1-SNAPSHOT'

description = 'Sign language learning API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0' // 충돌 방지 위해 주석 처리
    implementation 'com.google.api-client:google-api-client:2.4.0'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    //implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Builds the synonym embedding cache (calls OpenAI; needs OPENAI_API_KEY). The output must not be committed.
tasks.register('buildSynonymCache', JavaExec) {
    group = 'application'
    description = 'Embeds every word-vocabulary mapping word for the generation synonym step.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wow.signlanguage.generation.SynonymCacheBuilder'
    args = [findProperty('vocab') ?: '', findProperty('out') ?: '', findProperty('model') ?: '',
            findProperty('dimensions') ?: '']
}
